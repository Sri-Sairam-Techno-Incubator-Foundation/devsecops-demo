name: DevSecOps Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # -------------------------
      # GitLeaks - Secret Scanning
      # -------------------------
      - name: Install GitLeaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/scripts/install.sh | sh -s -- -b /tmp

      - name: GitLeaks Secret Scan
        run: |
          /tmp/gitleaks detect --source . --no-git

      # -------------------------
      # Semgrep - SAST
      # -------------------------
      - name: Semgrep SAST Scan
        run: |
          source ~/semgrep-env/bin/activate
          semgrep scan --config=auto .

      # -------------------------
      # Docker Build
      # -------------------------
      - name: Build Docker Image
        run: |
          docker build -t devsecops-demo:ci .

      # -------------------------
      # Trivy - Container Scan
      # -------------------------
      - name: Trivy Container Scan
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            devsecops-demo:ci
