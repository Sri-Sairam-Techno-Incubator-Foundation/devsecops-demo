
name: DevSecOps Security Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]

    steps:

      # =========================
      # Checkout Source Code
      # =========================
      - name: Checkout source code
        uses: actions/checkout@v4

      # =========================
      # GitLeaks - Secret Scanning
      # =========================
      - name: Install GitLeaks
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: GitLeaks Secret Scan
        run: |
          /tmp/gitleaks detect --source . --no-git

      # =========================
      # Semgrep - SAST
      # =========================
      - name: Create Semgrep Virtual Environment
        run: |
          python3 -m venv /tmp/semgrep-env
          /tmp/semgrep-env/bin/python -m pip install --upgrade pip
          /tmp/semgrep-env/bin/pip install semgrep

      - name: Semgrep SAST Scan
        run: |
          /tmp/semgrep-env/bin/semgrep scan --config=auto .

      # =========================
      # Docker Build
      # =========================
      - name: Build Docker Image
        run: |
          docker build -t devsecops-demo:ci .

      # =========================
      # Trivy - Container Security
      # =========================
      - name: Trivy Container Scan
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            devsecops-demo:ci
