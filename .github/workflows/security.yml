name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]

    steps:

      # ========================================
      # 1. Checkout Source Code
      # ========================================
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ========================================
      # 2. GitLeaks - Secret Scanning
      # ========================================
      - name: Install GitLeaks
        run: |
          GITLEAKS_VERSION="8.24.2"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks

          /tmp/gitleaks version

      - name: GitLeaks Secret Scan
        run: |
          /tmp/gitleaks detect \
            --source . \
            --no-git \
            --report-format json \
            --report-path gitleaks-report.json


      # ========================================
      # 3. Semgrep - SAST
      # ========================================
      - name: Semgrep SAST Scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            --json \
            --output /src/semgrep-report.json \
            /src


      # ========================================
      # 4. Docker Build
      # ========================================
      - name: Build Docker Image
        run: |
          docker build \
            -t devsecops-demo:ci \
            .


      # ========================================
      # 5. Trivy - Container Security Gate
      # ========================================
      - name: Trivy Container Security Gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/work" \
            aquasec/trivy:latest \
            image \
            --severity CRITICAL \
            --exit-code 1 \
            --format json \
            --output /work/trivy-report.json \
            devsecops-demo:ci


      # ========================================
      # 6. Start Application for ZAP
      # ========================================
      - name: Start Demo Application
        run: |
          docker rm -f devsecops-zap-target 2>/dev/null || true

          docker run -d \
            --name devsecops-zap-target \
            -p 3001:3000 \
            devsecops-demo:ci

          sleep 10

          curl -f http://localhost:3001/health


      # ========================================
      # 7. OWASP ZAP - DAST
      # ========================================
      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$PWD:/zap/wrk:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://127.0.0.1:3001 \
            -r zap-report.html \
            -I


      # ========================================
      # 8. Upload Security Reports
      # ========================================
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            semgrep-report.json
            trivy-report.json
            zap-report.html
          if-no-files-found: ignore


      # ========================================
      # 9. Login to GHCR
      # ========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ========================================
      # 10. Tag Docker Images
      # ========================================
      - name: Tag Docker Images
        run: |
          docker tag \
            devsecops-demo:ci \
            ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo:latest

          docker tag \
            devsecops-demo:ci \
            ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo:${{ github.sha }}


      # ========================================
      # 11. Push Docker Images to GHCR
      # ========================================
      - name: Push Docker Images to GHCR
        run: |
          docker push \
            ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo:latest

          docker push \
            ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo:${{ github.sha }}


      # ========================================
      # 12. Automated Deployment
      # ========================================
      - name: Deploy Application
        run: |
          echo "Starting deployment..."

          docker login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"

          echo "Pulling versioned image..."

          docker pull \
            ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo:${{ github.sha }}

          echo "Stopping old container..."

          docker rm -f devsecops-demo 2>/dev/null || true

          echo "Starting new container..."

          docker run -d \
            --name devsecops-demo \
            --restart unless-stopped \
            -p 3000:3000 \
            ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo:${{ github.sha }}

          echo "Waiting for application..."

          sleep 10

          echo "Running health check..."

          curl -f http://localhost:3000/health

          echo "Deployment successful!"


      # ========================================
      # 13. Cleanup
      # ========================================
      - name: Cleanup
        if: always()
        run: |
          docker rm -f devsecops-zap-target 2>/dev/null || true
