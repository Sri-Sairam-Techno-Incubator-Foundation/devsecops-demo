name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]

    steps:

      # ========================================
      # 1. Checkout Source Code
      # ========================================
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ========================================
      # 2. GitLeaks - Secret Scanning
      # ========================================
      - name: Install GitLeaks
        run: |
          GITLEAKS_VERSION="8.24.2"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks

          /tmp/gitleaks version

      - name: GitLeaks Secret Scan
        run: |
          /tmp/gitleaks detect \
            --source . \
            --no-git \
            --report-format json \
            --report-path gitleaks-report.json


      # ========================================
      # 3. Semgrep - SAST
      # ========================================
      - name: Semgrep SAST Scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            --json \
            --output /src/semgrep-report.json \
            /src


      # ========================================
      # 4. Docker Build
      # ========================================
      - name: Build Docker Image
        run: |
          docker build \
            -t devsecops-demo:ci \
            .


      # ========================================
      # 5. Trivy - Container Security
      # ========================================
      - name: Trivy Container Security Gate
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/work" \
            aquasec/trivy:latest \
            image \
            --severity CRITICAL \
            --exit-code 1 \
            --format json \
            --output /work/trivy-report.json \
            devsecops-demo:ci


      # ========================================
      # 6. Start Application for ZAP
      # ========================================
      - name: Start Demo Application
        run: |
          docker rm -f devsecops-zap-target 2>/dev/null || true

          docker run -d \
            --name devsecops-zap-target \
            -p 3001:3000 \
            devsecops-demo:ci

          sleep 10

          curl -f http://localhost:3001/health


      # ========================================
      # 7. OWASP ZAP - DAST
      # ========================================
      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "$PWD:/zap/wrk:rw" \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://127.0.0.1:3001 \
            -r zap-report.html \
            -I


      # ========================================
      # 8. Upload Security Reports
      # ========================================
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            semgrep-report.json
            trivy-report.json
            zap-report.html
          if-no-files-found: ignore


      # ========================================
      # 9. Login to GHCR
      # ========================================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ========================================
      # 10. Tag Docker Images
      # ========================================
      - name: Tag Docker Images
        run: |
          IMAGE="ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo"

          docker tag \
            devsecops-demo:ci \
            ${IMAGE}:latest

          docker tag \
            devsecops-demo:ci \
            ${IMAGE}:${{ github.sha }}


      # ========================================
      # 11. Push Docker Images to GHCR
      # ========================================
      - name: Push Docker Images to GHCR
        run: |
          IMAGE="ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo"

          docker push ${IMAGE}:latest

          docker push ${IMAGE}:${{ github.sha }}


      # ========================================
      # 12. Automated Deployment + Rollback
      # ========================================
      - name: Deploy Application
        run: |
          set -e

          IMAGE="ghcr.io/sri-sairam-techno-incubator-foundation/devsecops-demo"
          NEW_IMAGE="${IMAGE}:${{ github.sha }}"

          echo "========================================"
          echo "Starting deployment"
          echo "New image: ${NEW_IMAGE}"
          echo "========================================"

          # ----------------------------------------
          # Login to GHCR
          # ----------------------------------------
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"

          # ----------------------------------------
          # Pull new version
          # ----------------------------------------
          echo "Pulling new image..."

          docker pull "${NEW_IMAGE}"

          # ----------------------------------------
          # Detect currently running version
          # ----------------------------------------
          PREVIOUS_IMAGE=""

          if docker ps --format '{{.Names}}' | grep -q '^devsecops-demo$'; then

            PREVIOUS_IMAGE=$(docker inspect \
              --format='{{.Config.Image}}' \
              devsecops-demo)

            echo "Previous image:"
            echo "${PREVIOUS_IMAGE}"

          else

            echo "No previous deployment found."

          fi

          # ----------------------------------------
          # Stop old container
          # ----------------------------------------
          echo "Stopping old container..."

          docker rm -f devsecops-demo 2>/dev/null || true

          # ----------------------------------------
          # Start new container
          # ----------------------------------------
          echo "Starting new container..."

          docker run -d \
            --name devsecops-demo \
            --restart unless-stopped \
            -p 3000:3000 \
            "${NEW_IMAGE}"

          echo "Waiting for application..."
          sleep 10

          # ----------------------------------------
          # Health Check
          # ----------------------------------------
          echo "Running health check..."

          if curl -f --max-time 10 http://localhost:3000/health; then

            echo ""
            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Health check passed."
            echo "========================================"

          else

            echo ""
            echo "========================================"
            echo "NEW DEPLOYMENT FAILED"
            echo "Starting automatic rollback..."
            echo "========================================"

            # ----------------------------------------
            # Remove failed deployment
            # ----------------------------------------
            docker rm -f devsecops-demo 2>/dev/null || true

            # ----------------------------------------
            # Rollback
            # ----------------------------------------
            if [ -n "${PREVIOUS_IMAGE}" ]; then

              echo "Rolling back to:"
              echo "${PREVIOUS_IMAGE}"

              docker pull "${PREVIOUS_IMAGE}"

              docker run -d \
                --name devsecops-demo \
                --restart unless-stopped \
                -p 3000:3000 \
                "${PREVIOUS_IMAGE}"

              echo "Waiting for rollback..."
              sleep 10

              echo "Checking rollback health..."

              if curl -f --max-time 10 http://localhost:3000/health; then

                echo ""
                echo "========================================"
                echo "ROLLBACK SUCCESSFUL"
                echo "Previous version restored."
                echo "========================================"

              else

                echo ""
                echo "========================================"
                echo "ROLLBACK FAILED"
                echo "Manual intervention required."
                echo "========================================"

                exit 1

              fi

            else

              echo "No previous image available for rollback."

              exit 1

            fi

            # New deployment failed
            exit 1

          fi


      # ========================================
      # 13. Final Deployment Verification
      # ========================================
      - name: Final Deployment Verification
        run: |
          echo "Checking running container..."

          docker ps --filter "name=devsecops-demo"

          echo ""
          echo "Application health:"

          curl -f http://localhost:3000/health

          echo ""
          echo "Running image:"

          docker inspect \
            --format='{{.Config.Image}}' \
            devsecops-demo


      # ========================================
      # 14. Cleanup
      # ========================================
      - name: Cleanup
        if: always()
        run: |
          docker rm -f devsecops-zap-target 2>/dev/null || true
