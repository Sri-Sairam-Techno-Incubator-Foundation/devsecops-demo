
name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: [self-hosted, Linux, X64]

    steps:

      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ========================================
      # 2. GitLeaks - Secret Scanning
      # ========================================
      - name: Install GitLeaks
        run: |
          GITLEAKS_VERSION="8.24.2"

          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz

          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks

          /tmp/gitleaks version

      - name: GitLeaks Secret Scan
        run: |
          /tmp/gitleaks detect \
            --source . \
            --no-git


      # ========================================
      # 3. Semgrep - SAST
      # Docker based - No Python required
      # ========================================
      - name: Semgrep SAST Scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            /src


      # ========================================
      # 4. Docker Build
      # ========================================
      - name: Build Docker Image
        run: |
          docker build \
            -t devsecops-demo:ci \
            .


      # ========================================
      # 5. Trivy - Container Security
      # ========================================
      - name: Trivy Container Scan
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --format table \
            devsecops-demo:ci


      # ========================================
      # 6. ZAP - DAST
      # ========================================
      - name: Start Demo Application
        run: |
          docker rm -f devsecops-zap-target 2>/dev/null || true

          docker run -d \
            --name devsecops-zap-target \
            -p 3001:3000 \
            devsecops-demo:ci

          sleep 10

          curl -f http://localhost:3001/health


      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            zaproxy/zap-stable \
            zap-baseline.py \
            -t http://127.0.0.1:3001 \
            -I


      # ========================================
      # 7. Cleanup
      # ========================================
      - name: Cleanup
        if: always()
        run: |
          docker rm -f devsecops-zap-target 2>/dev/null || true
